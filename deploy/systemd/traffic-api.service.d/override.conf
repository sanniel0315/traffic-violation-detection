[Service]
Restart=always
RestartSec=3
StartLimitBurst=50
StartLimitIntervalSec=600
# 攝影機斷線時 native code 偶發 SEGV → 禁止 core dump 避免塞爆磁碟
LimitCORE=0
SupplementaryGroups=dialout
# RTSP 走 TCP + timeout，避免掉包卡死；threads=1 降 native 並發崩潰風險
Environment=OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|stimeout;10000000|buffer_size;131072|allowed_media_types;video|analyzeduration;1000000|probesize;1000000|threads;1
# IO daemon 獨立 process（RS-485），traffic-api 以 HTTP client 連
Environment=IO_DAEMON_URL=http://127.0.0.1:8011
TimeoutStopSec=10
KillMode=mixed
