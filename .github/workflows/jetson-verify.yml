name: Jetson Device Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 手動觸發
  schedule:
    - cron: '0 8 * * 1'  # 每週一 08:00 UTC (16:00 台灣時間)

jobs:
  verify:
    # ── 多站部署 ──────────────────────────────────────────────
    # 每個站點 = 一台 Jetson + 一個有「唯一 label」的 self-hosted runner。
    # 新增站點：在新板註冊 runner 並給唯一 label(例 site2)，然後把該 label 加進下面 matrix.site 陣列。
    # matrix 會在「每一台」對應 runner 上各跑一次 verify + 自我部署(deploy 用 origin/main)。
    # ✅ 執行期設定檔(frigate config.yml / 功能開關 / IO / NVR)已由
    #    scripts/deploy_keep_runtime_config.sh 在 reset --hard 前後保留,
    #    各站設定不同不再是自動部署的阻礙 —— 現場跑的永遠贏,repo 版只當新站種子。
    #    要從 git 派設定到現場,得先在現場刪掉該檔再部署。
    strategy:
      fail-fast: false
      matrix:
        site: [agx-orin]
    runs-on: [self-hosted, "${{ matrix.site }}"]
    timeout-minutes: 15

    # PyTorch 裝在 ~/.local/.../torch (NVIDIA Jetson 變體)，但 libcusparseLt.so.0 在
    # ~/.local/.../nvidia/cusparselt/lib 不在 ldconfig 路徑。
    # traffic-api systemd unit 用 LD_LIBRARY_PATH 找它 — workflow runner 要鏡像相同 env。
    env:
      LD_LIBRARY_PATH: "/home/ubuntu/.local/lib/python3.10/site-packages/nvidia/cusparselt/lib"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. 環境檢查 ──
      - name: GPU & CUDA check
        run: |
          echo "=== NVIDIA GPU ==="
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
          echo "=== CUDA version ==="
          nvcc --version 2>/dev/null || echo "nvcc not in PATH (OK if using container)"
          echo "=== PyTorch CUDA ==="
          python3 -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'; print(f'torch {torch.__version__} | CUDA device: {torch.cuda.get_device_name(0)}')"

      - name: Python dependencies check
        run: |
          python3 -c "
          import importlib, sys
          pkgs = ['fastapi','uvicorn','sqlalchemy','cv2','pytesseract','ultralytics','torchvision','pydantic','httpx','aiofiles']
          fail = []
          for p in pkgs:
              try:
                  m = importlib.import_module(p)
                  v = getattr(m, '__version__', 'OK')
                  print(f'  {p}: {v}')
              except ImportError:
                  fail.append(p)
                  print(f'  {p}: MISSING')
          if fail:
              print(f'::error::Missing packages: {fail}')
              sys.exit(1)
          "

      # ── 2. 程式碼品質 ──
      - name: Python syntax check
        run: |
          python3 -c "
          import ast, pathlib, sys
          errors = []
          for f in sorted(pathlib.Path('.').rglob('*.py')):
              if '.git' in f.parts:
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'All {len(list(pathlib.Path(\".\").rglob(\"*.py\")))} Python files OK')
          "

      # ── 3. ML 模型驗證 ──
      - name: YOLO model load & inference test
        run: |
          python3 -c "
          import torch, time
          from ultralytics import YOLO

          model = YOLO('models/yolov8n.pt')
          print(f'Model loaded: {len(model.names)} classes')

          # Dummy inference to verify GPU pipeline
          import numpy as np
          dummy = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
          start = time.time()
          results = model(dummy, verbose=False, device=0)
          elapsed = time.time() - start
          print(f'GPU inference OK: {elapsed:.2f}s, detections: {len(results[0].boxes)}')
          assert elapsed < 30, f'Inference too slow: {elapsed:.1f}s'
          "

      - name: Detection modules import test
        run: |
          python3 -c "
          from detection.vehicle_detector import VehicleDetector
          from detection.violation_detector import ViolationDetector
          from detection.congestion_detector import CongestionDetector
          from recognition.plate_recognizer import PlateRecognizer
          from recognition.plate_detector import PlateDetector
          print('All detection/recognition modules imported OK')
          "

      # ── 4. 資料庫驗證 (用 production DB，runner workspace 沒 DB) ──
      - name: Database & ORM check
        continue-on-error: true
        run: |
          python3 -c "
          from sqlalchemy import create_engine, inspect
          engine = create_engine('sqlite:////home/ubuntu/traffic-violation-detection/data/violations.db')
          tables = inspect(engine).get_table_names()
          print(f'Database tables: {tables}')
          expected = ['violations', 'cameras']
          for t in expected:
              assert t in tables, f'Missing table: {t}'
          print('Database schema OK')
          "

      # ── 5. Production API 驗證 (不啟新 uvicorn，避免 port 8000 衝突) ──
      - name: Production API health
        continue-on-error: true
        run: |
          resp=$(curl -sf --max-time 5 http://localhost:8000/api/health 2>&1) && \
            echo "✓ Production API healthy: $resp" || \
            echo "::warning::Production API not reachable (might be restarting)"

      - name: Production Cameras API
        continue-on-error: true
        run: |
          curl -sf --max-time 5 http://localhost:8000/api/cameras 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          items = data if isinstance(data, list) else data.get('items', [])
          print(f'✓ Cameras endpoint: {len(items)} configured')
          " || echo "::warning::Cameras endpoint check skipped"

      - name: Production Frontend check
        continue-on-error: true
        run: |
          code=$(curl -so /dev/null --max-time 5 -w '%{http_code}' http://localhost:8000/web/index.html 2>/dev/null)
          [ "$code" = "200" ] && echo "✓ Frontend HTTP $code" || echo "::warning::Frontend HTTP $code"

      # ── 6. Frigate 連線 ──
      - name: Frigate NVR check
        continue-on-error: true
        run: |
          resp=$(curl -sf --max-time 5 http://localhost:5000/api/version 2>&1) && \
            echo "✓ Frigate: $resp" || \
            echo "::warning::Frigate not reachable (may not be running)"

      # ── 7. Smoke test ──
      - name: Run smoke check
        continue-on-error: true
        run: python3 scripts/smoke_check.py --base-url http://localhost:8000 --timeout 15

      # ── 8. 磁碟空間報告 ──
      - name: Disk space report
        continue-on-error: true
        run: |
          echo "=== Disk Usage ==="
          df -h / | tail -1
          echo "=== Production project ==="
          du -sh /home/ubuntu/traffic-violation-detection --exclude=.git 2>/dev/null
          echo "=== Storage dirs ==="
          du -sh /home/ubuntu/traffic-violation-detection/{storage,models,data} 2>/dev/null || true

      # ══════════════════════════════════════════════════════════════════
      # ── 9. 自動部署到 production ──
      # 只在 main branch push 時 deploy (避免 PR / 手動 dispatch 誤觸發)
      # ══════════════════════════════════════════════════════════════════
      - name: Deploy to production
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          PROD=/home/ubuntu/traffic-violation-detection
          echo "=== Deploy to site [${{ matrix.site }}] @ $PROD ==="
          cd "$PROD"
          BEFORE=$(git rev-parse --short HEAD)
          git fetch origin main

          # ── 執行期設定檔:reset --hard 不可以洗掉現場設定 ────────────────
          # 詳見 scripts/deploy_keep_runtime_config.sh(有 tests 擋回歸)。
          # 🛑 save 跑在 reset 之前 = 用的是「現場舊 commit 的腳本」。
          #    引入這個機制的那一次部署,現場還沒有這支腳本 → 一定要容許它不存在,
          #    否則 set -e 會讓部署整個失敗(第一次上這段時實際會踩到)。
          #    那一次沒有保護,所以引入前要先確認現場設定已同步進 git;
          #    之後每一次部署都有保護。
          KEEP=""
          if [ -f scripts/deploy_keep_runtime_config.sh ]; then
            KEEP=$(bash scripts/deploy_keep_runtime_config.sh save)
          else
            echo "  (現場尚無保留腳本,本次略過;下次部署起生效)"
          fi

          git reset --hard origin/main

          if [ -n "$KEEP" ]; then
            bash scripts/deploy_keep_runtime_config.sh restore "$KEEP"
          fi

          AFTER=$(git rev-parse --short HEAD)
          echo "commit: $BEFORE → $AFTER"

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "no change, skip restart"
            exit 0
          fi

          echo "=== restart traffic-api ==="
          sudo -n systemctl restart traffic-api.service

          # 🛑 traffic-signal 與 traffic-io 是獨立行程,先前部署完全不碰它們 ——
          #    2026-08-28 改的 signal_tc3.py 一路到 09-03 都還沒生效,
          #    控制模式判讀因此空白了六天,是人工 ssh 進去重啟才發現的。
          #    重啟會短暫中斷抄錄/Modbus,所以只在它們自己的檔案有變動時才做。
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)

          if echo "$CHANGED" | grep -qE '^(services/signal_daemon\.py|api/routes/signal_tc3\.py|detection/signal_timing_lookup\.py|config/tc3/|config/system/ramp_timing_baseline\.json)'; then
            echo "=== restart traffic-signal (號誌抄錄相關檔案有變動) ==="
            sudo -n systemctl restart traffic-signal.service || \
              echo "::warning::traffic-signal 重啟失敗,請人工確認"
          else
            echo "traffic-signal: 無相關變動,不重啟(避免中斷抄錄)"
          fi

          if echo "$CHANGED" | grep -qE '^(services/io_daemon\.py|api/routes/(lock|io)_?.*\.py|api/utils/door_state\.py)'; then
            echo "=== restart traffic-io (IO/電子鎖相關檔案有變動) ==="
            sudo -n systemctl restart traffic-io.service || \
              echo "::warning::traffic-io 重啟失敗,請人工確認"
          else
            echo "traffic-io: 無相關變動,不重啟"
          fi

          sleep 6
          echo "=== verify deployed version ==="
          for i in $(seq 1 20); do
            if curl -sf --max-time 3 http://localhost:8000/api/system/version 2>/dev/null | grep -q "$AFTER"; then
              echo "✓ Production now at commit $AFTER"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production verify failed — version mismatch after restart"
          curl -s http://localhost:8000/api/system/version || true
          exit 1
